name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Builds the API reference with the same script as the documentation job of
  # the CI.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the tools
        run: |
          sudo apt-get update
          # shellcheck disable=SC2046
          sudo apt-get install -y $(.github/ci/run.sh --apt documentation)

      - name: Build the documentation
        run: .github/ci/run.sh documentation

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/documentation/docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
