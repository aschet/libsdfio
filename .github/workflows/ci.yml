name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            options: -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          - name: clang
            cc: clang
            options: -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          - name: C99, gcc
            cc: gcc
            options: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_C_FLAGS=-pedantic-errors -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          - name: C99, clang
            cc: clang
            options: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_C_FLAGS=-pedantic-errors -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          - name: shared library
            cc: gcc
            options: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          - name: address and undefined behavior sanitizers
            cc: clang
            options: -DCMAKE_BUILD_TYPE=Debug -DSDFIO_SANITIZE=ON
          - name: thread sanitizer
            cc: gcc
            options: -DCMAKE_BUILD_TYPE=Debug -DSDFIO_SANITIZE_THREAD=ON
          - name: without text and local time
            cc: gcc
            options: -DCMAKE_BUILD_TYPE=Debug -DSDFIO_SANITIZE=ON -DSDFIO_TEXT=OFF -DSDFIO_LOCAL_TIME=OFF
    steps:
      - uses: actions/checkout@v7
      - name: Let the sanitizers map their memory
        run: sudo sysctl vm.mmap_rnd_bits=28 || true
      - name: Configure
        run: cmake -S . -B build ${{ matrix.options }}
        env:
          CC: ${{ matrix.cc }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  windows:
    name: Windows, ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static library
            shared: "OFF"
          - name: DLL
            shared: "ON"
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

  big-endian:
    name: Big endian (s390x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the compiler and the emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-s390x-linux-gnu libc6-dev-s390x-cross
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=s390x
          -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-s390x;-L;/usr/s390x-linux-gnu"
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DSDFIO_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  arm-32-bit:
    name: 32-bit ARM (armhf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the compiler and the emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/arm-linux-gnueabihf"
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DSDFIO_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  cortex-m:
    name: Cortex-M4 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          -DCMAKE_C_COMPILER=arm-none-eabi-gcc
          "-DCMAKE_C_FLAGS=-mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 -ffunction-sections -fdata-sections"
          "-DCMAKE_EXE_LINKER_FLAGS=--specs=nano.specs --specs=nosys.specs"
          -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DBUILD_TESTING=OFF -DSDFIO_BUILD_EXAMPLES=OFF -DSDFIO_BUILD_FIRMWARE=ON
          -DSDFIO_TEXT=OFF -DSDFIO_LOCAL_TIME=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Size
        run: arm-none-eabi-size build/tests/embedded/firmware

  riscv:
    name: RISC-V firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_SYSTEM_PROCESSOR=riscv32
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          -DCMAKE_C_COMPILER=riscv64-unknown-elf-gcc
          "-DCMAKE_C_FLAGS=-march=rv32imac -mabi=ilp32 --specs=picolibc.specs -ffunction-sections -fdata-sections"
          -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DBUILD_TESTING=OFF -DSDFIO_BUILD_EXAMPLES=OFF -DSDFIO_BUILD_FIRMWARE=ON
          -DSDFIO_TEXT=OFF -DSDFIO_LOCAL_TIME=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Size
        run: riscv64-unknown-elf-size build/tests/embedded/firmware

  tidy:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy
        run: |
          pipx install "clang-tidy==21.1.6"
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DSDFIO_BUILD_EXAMPLES=ON
      - name: Check
        run: >
          clang-tidy -p build --warnings-as-errors='*'
          $(ls src/*.c tests/*.c examples/*.c | grep -v -e file_windows -e test_wide)

  package:
    name: Install and use, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            generator: Ninja
          - name: macOS
            os: macos-latest
            generator: Ninja
          - name: Windows
            os: windows-latest
            generator: ""
    steps:
      - uses: actions/checkout@v7
      # The library is installed, and a project of its own finds it with
      # find_package and links it, as a user's project does.
      - name: Install and use
        env:
          GENERATOR: ${{ matrix.generator }}
        run: |
          if [ -n "$GENERATOR" ]; then
            configure=(-G "$GENERATOR" -DCMAKE_BUILD_TYPE=Release)
          else
            configure=()
          fi
          for linkage in ON OFF; do
            echo "== BUILD_SHARED_LIBS=$linkage"
            build="build-$linkage"
            stage="$PWD/stage-$linkage"
            cmake -S . -B "$build" "${configure[@]}" \
              -DBUILD_SHARED_LIBS=$linkage \
              -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
              -DCMAKE_INSTALL_PREFIX="$stage"
            cmake --build "$build" --config Release
            cmake --install "$build" --config Release
            cmake -S test_package -B "$build/consumer" "${configure[@]}" \
              -DCMAKE_PREFIX_PATH="$stage"
            cmake --build "$build/consumer" --config Release
            consumer=$(find "$build/consumer" \
              \( -name test_package -o -name test_package.exe \) -type f | head -1)
            PATH="$stage/bin:$PATH" LD_LIBRARY_PATH="$stage/lib" \
              DYLD_LIBRARY_PATH="$stage/lib" "$consumer"
          done

  conan:
    name: Conan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Conan
        run: |
          pipx install conan
          bin_dir=$(pipx environment --value PIPX_BIN_DIR)
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/conan" profile detect --force
      - name: Create the package
        run: |
          for shared in True False; do
            echo "== shared=$shared"
            conan create . -o "sdfio/*:shared=$shared"
          done

  vcpkg:
    name: vcpkg, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            triplets: x64-linux x64-linux-dynamic
          - name: macOS
            os: macos-latest
            triplets: arm64-osx arm64-osx-dynamic
          - name: Windows
            os: windows-latest
            triplets: x64-windows-static x64-windows
    steps:
      - uses: actions/checkout@v7
      # The port of this repository is an overlay port: it builds the library
      # from the checkout, and a project of its own finds the result with the
      # toolchain file of vcpkg.
      - name: Install and use
        env:
          TRIPLETS: ${{ matrix.triplets }}
        run: |
          for triplet in $TRIPLETS; do
            echo "== $triplet"
            installed="$PWD/vcpkg_installed-$triplet"
            "$VCPKG_INSTALLATION_ROOT/vcpkg" install sdfio \
              --overlay-ports=ports --triplet="$triplet" \
              --x-install-root="$installed" --binarysource=clear
            cmake -S test_package -B "build-$triplet" \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET="$triplet" \
              -DVCPKG_INSTALLED_DIR="$installed" \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-$triplet" --config Release
            consumer=$(find "build-$triplet" \
              \( -name test_package -o -name test_package.exe \) -type f | head -1)
            PATH="$installed/$triplet/bin:$PATH" \
              LD_LIBRARY_PATH="$installed/$triplet/lib" \
              DYLD_LIBRARY_PATH="$installed/$triplet/lib" "$consumer"
          done

  reuse:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v5
