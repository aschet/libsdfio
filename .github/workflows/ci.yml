name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # One machine for all of Linux: the steps share the checkout and the tools,
  # and every step runs, so that a failure does not hide the next.
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qemu-user \
            gcc-s390x-linux-gnu libc6-dev-s390x-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          pipx install "clang-tidy==21.1.6"
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
          # The sanitizers map their memory
          sudo sysctl vm.mmap_rnd_bits=28 || true

      - name: GCC in strict C99, installed and used
        env:
          CC: gcc
          GENERATOR: Ninja
          CONFIGURE_OPTIONS: >-
            -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON
            -DCMAKE_C_FLAGS=-pedantic-errors -DSDFIO_BUILD_EXAMPLES=ON
        run: .github/ci/install-and-use.sh

      - name: Clang with the address and undefined behavior sanitizers
        if: ${{ !cancelled() }}
        run: |
          CC=clang cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DSDFIO_SANITIZE=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DSDFIO_BUILD_EXAMPLES=ON
          cmake --build build/asan
          ctest --test-dir build/asan --output-on-failure --no-tests=error

      - name: GCC with the thread sanitizer
        if: ${{ !cancelled() }}
        run: |
          CC=gcc cmake -S . -B build/tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DSDFIO_SANITIZE_THREAD=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build/tsan
          ctest --test-dir build/tsan --output-on-failure --no-tests=error

      - name: Without text and local time
        if: ${{ !cancelled() }}
        run: |
          CC=gcc cmake -S . -B build/minimal -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DSDFIO_SANITIZE=ON -DSDFIO_TEXT=OFF -DSDFIO_LOCAL_TIME=OFF
          cmake --build build/minimal
          ctest --test-dir build/minimal --output-on-failure --no-tests=error

      - name: Big endian, s390x
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build/s390x -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=s390x \
            -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-s390x;-L;/usr/s390x-linux-gnu" \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DSDFIO_BUILD_EXAMPLES=ON
          cmake --build build/s390x
          ctest --test-dir build/s390x --output-on-failure --no-tests=error

      - name: 32-bit ARM, armhf
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build/armhf -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/arm-linux-gnueabihf" \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DSDFIO_BUILD_EXAMPLES=ON
          cmake --build build/armhf
          ctest --test-dir build/armhf --output-on-failure --no-tests=error

      - name: Cortex-M4 firmware
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build/cortex-m -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER=arm-none-eabi-gcc \
            "-DCMAKE_C_FLAGS=-mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 -ffunction-sections -fdata-sections" \
            "-DCMAKE_EXE_LINKER_FLAGS=--specs=nano.specs --specs=nosys.specs" \
            -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DBUILD_TESTING=OFF -DSDFIO_BUILD_EXAMPLES=OFF \
            -DSDFIO_BUILD_FIRMWARE=ON -DSDFIO_TEXT=OFF -DSDFIO_LOCAL_TIME=OFF
          cmake --build build/cortex-m
          arm-none-eabi-size build/cortex-m/tests/embedded/firmware

      - name: RISC-V firmware
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build/riscv -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_SYSTEM_PROCESSOR=riscv32 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER=riscv64-unknown-elf-gcc \
            "-DCMAKE_C_FLAGS=-march=rv32imac -mabi=ilp32 --specs=picolibc.specs -ffunction-sections -fdata-sections" \
            -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DBUILD_TESTING=OFF -DSDFIO_BUILD_EXAMPLES=OFF \
            -DSDFIO_BUILD_FIRMWARE=ON -DSDFIO_TEXT=OFF -DSDFIO_LOCAL_TIME=OFF
          cmake --build build/riscv
          riscv64-unknown-elf-size build/riscv/tests/embedded/firmware

      - name: Static analysis
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSDFIO_BUILD_EXAMPLES=ON
          # The files for Windows cannot be analyzed here
          clang-tidy -p build/tidy --warnings-as-errors='*' \
            $(ls src/*.c tests/*.c examples/*.c | grep -v -e file_windows -e test_wide)

      - name: Format
        if: ${{ !cancelled() }}
        run: |
          clang-format --dry-run -Werror src/*.c src/*.h include/sdfio/*.h \
            tests/*.c tests/fuzz/*.c tests/embedded/*.c test_package/*.c \
            examples/*.c examples/integrations/*.cpp

      - name: Conan
        if: ${{ !cancelled() }}
        run: |
          pipx install conan
          conan profile detect --force
          for shared in True False; do
            conan create . -o "sdfio/*:shared=$shared"
          done

      - name: vcpkg
        if: ${{ !cancelled() }}
        run: |
          for triplet in x64-linux x64-linux-dynamic; do
            installed="$PWD/vcpkg_installed-$triplet"
            "$VCPKG_INSTALLATION_ROOT/vcpkg" install sdfio \
              --overlay-ports=ports --triplet="$triplet" \
              --x-install-root="$installed" --binarysource=clear
            cmake -S test_package -B "build/vcpkg-$triplet" \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET="$triplet" \
              -DVCPKG_INSTALLED_DIR="$installed" -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/vcpkg-$triplet"
            LD_LIBRARY_PATH="$installed/$triplet/lib" \
              "build/vcpkg-$triplet/test_package"
          done

      - name: Licenses
        if: ${{ !cancelled() }}
        uses: fsfe/reuse-action@v5

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build, test, install and use
        env:
          GENERATOR: Ninja
        run: .github/ci/install-and-use.sh

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build, test, install and use
        env:
          GENERATOR: ""
        run: .github/ci/install-and-use.sh
