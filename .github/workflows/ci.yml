name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            options: -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          - name: clang
            cc: clang
            options: -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          - name: shared library
            cc: gcc
            options: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          - name: address and undefined behavior sanitizers
            cc: clang
            options: -DCMAKE_BUILD_TYPE=Debug -DSDFIO_SANITIZE=ON
          - name: thread sanitizer
            cc: gcc
            options: -DCMAKE_BUILD_TYPE=Debug -DSDFIO_SANITIZE_THREAD=ON
          - name: without text and local time
            cc: gcc
            options: -DCMAKE_BUILD_TYPE=Debug -DSDFIO_SANITIZE=ON -DSDFIO_TEXT=OFF -DSDFIO_LOCAL_TIME=OFF
    steps:
      - uses: actions/checkout@v4
      - name: Let the sanitizers map their memory
        run: sudo sysctl vm.mmap_rnd_bits=28 || true
      - name: Configure
        run: cmake -S . -B build ${{ matrix.options }}
        env:
          CC: ${{ matrix.cc }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows, ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static library
            shared: "OFF"
          - name: DLL
            shared: "ON"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  big-endian:
    name: Big endian (s390x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the compiler and the emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-s390x-linux-gnu libc6-dev-s390x-cross
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=s390x
          -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-s390x;-L;/usr/s390x-linux-gnu"
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DSDFIO_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cortex-m:
    name: Cortex-M4 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          -DCMAKE_C_COMPILER=arm-none-eabi-gcc
          "-DCMAKE_C_FLAGS=-mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 -ffunction-sections -fdata-sections"
          "-DCMAKE_EXE_LINKER_FLAGS=--specs=nano.specs --specs=nosys.specs"
          -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DBUILD_TESTING=OFF -DSDFIO_BUILD_EXAMPLES=OFF -DSDFIO_BUILD_FIRMWARE=ON
          -DSDFIO_TEXT=OFF -DSDFIO_LOCAL_TIME=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Size
        run: arm-none-eabi-size build/tests/embedded/firmware

  riscv:
    name: RISC-V firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_SYSTEM_PROCESSOR=riscv32
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          -DCMAKE_C_COMPILER=riscv64-unknown-elf-gcc
          "-DCMAKE_C_FLAGS=-march=rv32imac -mabi=ilp32 --specs=picolibc.specs -ffunction-sections -fdata-sections"
          -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DBUILD_TESTING=OFF -DSDFIO_BUILD_EXAMPLES=OFF -DSDFIO_BUILD_FIRMWARE=ON
          -DSDFIO_TEXT=OFF -DSDFIO_LOCAL_TIME=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Size
        run: riscv64-unknown-elf-size build/tests/embedded/firmware

  tidy:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: |
          pipx install "clang-tidy==21.1.6"
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DSDFIO_BUILD_EXAMPLES=ON
      - name: Check
        run: >
          clang-tidy -p build --warnings-as-errors='*'
          src/*.c tests/*.c examples/*.c

  reuse:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
