name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # What a job does and needs is in .github/ci/run.sh, which a developer runs
  # in the same way: run.sh <job>. The jobs of the first three groups are named
  # compiler, architecture and operating system.
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86-64 Linux
            runner: ubuntu-latest
            job: gcc-x86-64-linux
          - name: GCC x86 Linux
            runner: ubuntu-latest
            job: gcc-x86-linux
          - name: GCC AArch64 Linux
            runner: ubuntu-24.04-arm
            job: gcc-aarch64-linux
          - name: GCC ARM Linux
            runner: ubuntu-latest
            job: gcc-arm-linux
          - name: GCC z/Architecture Linux
            runner: ubuntu-latest
            job: gcc-z-architecture-linux
          - name: GCC RISC-V Linux
            runner: ubuntu-latest
            job: gcc-risc-v-linux
          - name: Clang x86-64 Linux
            runner: ubuntu-latest
            job: clang-x86-64-linux
          - name: Clang AArch64 macOS
            runner: macos-latest
            job: clang-aarch64-macos
          - name: MSVC x86-64 Windows
            runner: windows-latest
            job: msvc-x86-64-windows
          - name: MSVC x86 Windows
            runner: windows-latest
            job: msvc-x86-windows
          - name: MSVC AArch64 Windows
            runner: windows-11-arm
            job: msvc-aarch64-windows
          - name: GCC ARM bare metal
            runner: ubuntu-latest
            job: gcc-arm-bare-metal
          - name: GCC RISC-V bare metal
            runner: ubuntu-latest
            job: gcc-risc-v-bare-metal
          - name: ASan and UBSan
            runner: ubuntu-latest
            job: asan-ubsan
          - name: TSan
            runner: ubuntu-latest
            job: tsan
          - name: Static analysis
            runner: ubuntu-latest
            job: static-analysis
          - name: Format
            runner: ubuntu-latest
            job: format
          - name: Documentation
            runner: ubuntu-latest
            job: documentation
          - name: Licenses
            runner: ubuntu-latest
            job: licenses
    steps:
      - uses: actions/checkout@v7

      - name: Install the tools
        if: ${{ runner.os == 'Linux' }}
        env:
          JOB: ${{ matrix.job }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2046
          sudo apt-get install -y $(.github/ci/run.sh --apt "$JOB")
          for package in $(.github/ci/run.sh --pipx "$JOB"); do
            pipx install "$package"
          done

      - name: Run the job
        env:
          JOB: ${{ matrix.job }}
        run: .github/ci/run.sh "$JOB"
